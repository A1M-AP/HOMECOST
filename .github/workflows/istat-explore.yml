# TEMPORANEO: esplorazione dei sottoindici FOI per voce di spesa. Da rimuovere.
name: Esplora sottoindici ISTAT
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/istat-explore.yml']
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Esplora
        run: |
          cat > x.mjs <<'JS'
          const API = 'https://esploradati.istat.it/SDMXWS/rest';
          const ACCEPT = 'application/vnd.sdmx.structurespecificdata+xml;version=2.1';
          async function get(url, accept) {
            const r = await fetch(url, { headers: accept ? { Accept: accept } : {}, signal: AbortSignal.timeout(240000) });
            console.log(r.status, url);
            return r.text();
          }
          const st = await get(`${API}/dataflow/IT1/169_748_DF_DCSP_FOI1B2025_1/1.0?references=all&detail=full`);
          console.log('structure bytes', st.length);
          for (const cl of st.matchAll(/<(?:\w+:)?Codelist\b[^>]*id="([^"]+)"[\s\S]*?<\/(?:\w+:)?Codelist>/g)) {
            const codes = [...cl[0].matchAll(/<(?:\w+:)?Code\b[^>]*id="([^"]+)"[^>]*>[\s\S]*?<(?:\w+:)?Name xml:lang="it">([^<]*)</g)];
            console.log(`== Codelist ${cl[1]} (${codes.length})`);
            const filt = codes.length > 60 ? codes.filter(c => /^(00|04|05|09|12)/.test(c[1])) : codes;
            for (const c of filt.slice(0, 400)) console.log(`  ${c[1]}  ${c[2]}`);
          }
          for (const dim of st.matchAll(/<(?:\w+:)?Dimension\b[^>]*id="([^"]+)"[^>]*position="(\d+)"/g)) console.log('DIM', dim[2], dim[1]);
          const data = await get(`${API}/data/IT1,169_748_DF_DCSP_FOI1B2025_1,1.0/M.IT.101.4.?startPeriod=2026-06`, ACCEPT);
          for (const s of data.matchAll(/<Series\b([^>]*)>([\s\S]*?)<\/Series>/g)) {
            const obs = [...s[2].matchAll(/TIME_PERIOD="([^"]+)"[^>]*OBS_VALUE="([^"]+)"|OBS_VALUE="([^"]+)"[^>]*TIME_PERIOD="([^"]+)"/g)].map(o => `${o[1]||o[4]}=${o[2]||o[3]}`);
            if (/"0[0-9]?[0-9]?[0-9]?ST"|"04|"05|"00/.test(s[1])) console.log('SERIE', s[1].trim(), obs.join(' '));
          }
          JS
          node x.mjs
