# TEMPORANEO: esplorazione dei sottoindici ISTAT per voce di spesa. Da rimuovere.
name: Esplora sottoindici ISTAT
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/istat-explore.yml']
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Esplora
        run: |
          cat > x.mjs <<'JS'
          const API = 'https://esploradati.istat.it/SDMXWS/rest';
          const ACCEPT = 'application/vnd.sdmx.structurespecificdata+xml;version=2.1';
          async function get(url, accept, ms = 600000) {
            try {
              const r = await fetch(url, { headers: accept ? { Accept: accept } : {}, signal: AbortSignal.timeout(ms) });
              console.log(r.status, url);
              return await r.text();
            } catch (e) { console.log('ERR', url, e.message); return ''; }
          }
          for (const flow of ['167_745_DF_DCSP_NIC1B2025_4', '167_745_DF_DCSP_NIC1B2025_3']) {
            const st = await get(`${API}/dataflow/IT1/${flow}/1.0?references=all&detail=full`);
            for (const dim of st.matchAll(/<(?:\w+:)?Dimension\b[^>]*id="([^"]+)"[^>]*position="(\d+)"/g)) console.log('DIM', flow, dim[2], dim[1]);
            const names = {};
            for (const cl of st.matchAll(/<(?:\w+:)?Codelist\b[^>]*id="([^"]+)"[\s\S]*?<\/(?:\w+:)?Codelist>/g)) {
              const codes = [...cl[0].matchAll(/<(?:\w+:)?Code\b[^>]*id="([^"]+)"[^>]*>[\s\S]*?<(?:\w+:)?Name xml:lang="it">([^<]*)</g)];
              console.log(`== ${flow} Codelist ${cl[1]} (${codes.length})`);
              if (codes.length < 40) for (const c of codes) console.log(`  ${c[1]}  ${c[2]}`);
              for (const c of codes) names[c[1]] = c[2];
            }
            const data = await get(`${API}/data/IT1,${flow},1.0/M.IT..4.?startPeriod=2026-01`, ACCEPT);
            let n = 0;
            for (const s of data.matchAll(/<Series\b([^>]*)>([\s\S]*?)<\/Series>/g)) {
              n++;
              const code = /ECOICOP[^=]*="([^"]+)"/.exec(s[1])?.[1] ?? '';
              const obs = [...s[2].matchAll(/<Obs\b([^>]*)\/?>/g)].map(o => `${/TIME_PERIOD="([^"]+)"/.exec(o[1])?.[1]}=${/OBS_VALUE="([^"]+)"/.exec(o[1])?.[1]}`);
              if (/^(00|04|043|045|0431|0432|0451|055|0551|0552)/.test(code)) console.log('SERIE', s[1].trim(), '|', names[code], '|', obs.join(' '));
            }
            console.log('serie totali', flow, n);
          }
          JS
          node x.mjs
