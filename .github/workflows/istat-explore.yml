# TEMPORANEO: esplorazione dei sottoindici ISTAT per voce di spesa. Da rimuovere.
name: Esplora sottoindici ISTAT
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/istat-explore.yml']
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Esplora
        run: |
          cat > x.mjs <<'JS'
          const API = 'https://esploradati.istat.it/SDMXWS/rest';
          const ACCEPT = 'application/vnd.sdmx.structurespecificdata+xml;version=2.1';
          async function get(url, accept, ms = 600000) {
            try {
              const r = await fetch(url, { headers: accept ? { Accept: accept } : {}, signal: AbortSignal.timeout(ms) });
              console.log(r.status, url);
              return await r.text();
            } catch (e) { console.log('ERR', url, e.message); return ''; }
          }
          // 1. DBnomics: dataset ISTAT sui prezzi
          for (const q of ['NIC', 'FOI', 'IPCA', 'costo di costruzione', 'prezzi al consumo']) {
            const t = await get(`https://api.db.nomics.world/v22/search?q=${encodeURIComponent(q)}&limit=100`, null, 60000);
            try {
              for (const d of JSON.parse(t).results.docs) if (d.provider_code === 'ISTAT') console.log('DBN', q, '|', d.code, '|', d.name);
            } catch {}
          }
          // 2. Elenco dataflow ISTAT
          const all = await get(`${API}/dataflow/IT1/all/latest`);
          for (const m of all.matchAll(/<(?:\w+:)?Dataflow\b[^>]*id="([^"]+)"[\s\S]*?<(?:\w+:)?Name xml:lang="it">([^<]*)</g)) {
            if (/NIC|FOI|IPCA|COSTR|CCR|PREZ/i.test(m[1] + m[2])) console.log('FLOW', m[1], '|', m[2]);
          }
          JS
          node x.mjs
