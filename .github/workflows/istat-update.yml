# Aggiorna ogni giorno gli indici ISTAT FOI (public/data/istat-foi.json) dall'API ufficiale ISTAT.
# Se ci sono dati nuovi fa un commit su main: Cloudflare ripubblica il sito e i prezzi
# dei calcolatori vengono rivalutati in automatico.
name: Aggiorna indici ISTAT

on:
  schedule:
    - cron: '23 7 * * *' # ogni giorno alle 7:23 UTC (l'ISTAT pubblica i dati FOI a metà mese)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: istat-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scarica gli indici ISTAT e aggiorna il file
        run: node scripts/update-istat.mjs
      - name: Commit se i dati sono cambiati
        run: |
          if git diff --quiet -- public/data/istat-foi.json; then
            echo "Nessun nuovo dato ISTAT."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/istat-foi.json
          git commit -m "Aggiorna indici ISTAT FOI ($(date -u +%Y-%m-%d))"
          git push origin "HEAD:${GITHUB_REF_NAME}"
