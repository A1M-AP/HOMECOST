name: istat-discover (temporaneo)
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/istat-discover.mjs']
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/istat-discover.mjs
